name: build

on:
  workflow_dispatch:
    inputs:
      pdfium_ref:
        description: "PDFium commit hash"
        required: true
      chromium_milestone:
        description: "Chromium milestone (example: M126)"
        required: true
      release_tag:
        description: "Release tag (default: M<milestone>-YYYY-MM-DD)"
        required: false
        default: ""

env:
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  build-ubuntu:
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-amd64
          - arch: arm64
            runner: self-hosted-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner architecture
        run: |
          case "${{ matrix.arch }}" in
            amd64) EXPECT_ARCH="x86_64" ;;
            arm64) EXPECT_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCH="$(uname -m)"
          if [[ "${ACTUAL_ARCH}" != "${EXPECT_ARCH}" ]]; then
            echo "Runner arch ${ACTUAL_ARCH} does not match expected ${EXPECT_ARCH}" >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            clang \
            curl \
            git \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            xz-utils \
            build-essential
      - name: Build PDFium
        run: |
          ./scripts/build_pdfium.sh \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --target-os ubuntu \
            --arch "${{ matrix.arch }}"
      - name: Package PDFium
        run: |
          ./scripts/package_pdfium.sh \
            --pdfium-src ./build/pdfium \
            --pdfium-out ./build/pdfium/out/Release \
            --target-os ubuntu \
            --arch "${{ matrix.arch }}" \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --chromium-milestone "${{ inputs.chromium_milestone }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-ubuntu-${{ matrix.arch }}
          path: dist/*.tar.xz

  build-alpine:
    runs-on: ${{ matrix.runner }}
    container: alpine:3.23
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-amd64
          - arch: arm64
            runner: self-hosted-arm64
    env:
      VPYTHON_BYPASS: "1"
    steps:
      - name: Install dependencies
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            clang \
            clang-dev \
            curl \
            git \
            gcompat \
            glib-dev \
            gn \
            libc++-dev \
            libc6-compat \
            lld \
            llvm \
            ninja \
            pkgconf \
            py3-pip \
            python3 \
            tar \
            wget \
            xz \
            build-base \
            linux-headers
          # Install Python deps for depot_tools (gclient)
          pip3 install httplib2 PySocks --break-system-packages -q
          # Create httplib2.socks shim (depot_tools expects this submodule)
          python3 -c '
          import httplib2, os
          socks_file = os.path.join(os.path.dirname(httplib2.__file__), "socks.py")
          with open(socks_file, "w") as f:
              f.write("import socks as _socks\nfrom socks import *\nsocksocket = _socks.socksocket\nPROXY_TYPE_HTTP = _socks.HTTP\nPROXY_TYPE_HTTP_NO_TUNNEL = _socks.HTTP\nProxyError = _socks.ProxyError\n")
          '
      # NOTE: Using manual git checkout because actions/checkout@v4 (JavaScript action)
      # doesn't work in Alpine containers on ARM64 runners
      - name: Checkout
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64) EXPECT_ARCH="x86_64" ;;
            arm64) EXPECT_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCH="$(uname -m)"
          if [[ "${ACTUAL_ARCH}" != "${EXPECT_ARCH}" ]]; then
            echo "Runner arch ${ACTUAL_ARCH} does not match expected ${EXPECT_ARCH}" >&2
            exit 1
          fi
      - name: Build PDFium
        shell: bash
        run: |
          ./scripts/build_pdfium.sh \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --target-os alpine \
            --arch "${{ matrix.arch }}"
      - name: Package PDFium
        shell: bash
        run: |
          ./scripts/package_pdfium.sh \
            --pdfium-src ./build/pdfium \
            --pdfium-out ./build/pdfium/out/Release \
            --target-os alpine \
            --arch "${{ matrix.arch }}" \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --chromium-milestone "${{ inputs.chromium_milestone }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-alpine-${{ matrix.arch }}
          path: dist/*.tar.xz

  release:
    runs-on: self-hosted-amd64
    needs:
      - build-ubuntu
      - build-alpine
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Set release tag
        id: tag
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            DATE_TAG=$(date -u +%Y-%m-%d)
            TAG="${{ inputs.chromium_milestone }}-${DATE_TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/**/*.tar.xz
