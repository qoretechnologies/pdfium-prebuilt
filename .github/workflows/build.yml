name: build

on:
  workflow_dispatch:
    inputs:
      pdfium_ref:
        description: "PDFium commit hash"
        required: true
      chromium_milestone:
        description: "Chromium milestone (example: M126)"
        required: true
      release_tag:
        description: "Release tag (default: M<milestone>-YYYY-MM-DD)"
        required: false
        default: ""

env:
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  build-ubuntu:
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/docker/library/ubuntu:24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-amd64
          - arch: arm64
            runner: self-hosted-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner architecture
        run: |
          case "${{ matrix.arch }}" in
            amd64) EXPECT_ARCH="x86_64" ;;
            arm64) EXPECT_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCH="$(uname -m)"
          if [[ "${ACTUAL_ARCH}" != "${EXPECT_ARCH}" ]]; then
            echo "Runner arch ${ACTUAL_ARCH} does not match expected ${EXPECT_ARCH}" >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            clang \
            curl \
            generate-ninja \
            git \
            libglib2.0-dev \
            lld \
            llvm \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            xz-utils \
            build-essential
      - name: Setup clang runtime symlinks (ARM64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          # PDFium build expects clang runtime libraries at specific paths
          # that differ from Ubuntu's default layout
          CLANG_VER=$(clang --version | head -1 | sed 's/.*version \([0-9]*\).*/\1/')
          echo "Detected system clang version: ${CLANG_VER}"

          # Find where Ubuntu has the clang runtime libs
          # Ubuntu 24.04 uses /usr/lib/llvm-<ver>/lib/clang/<ver>/lib/linux/
          UBUNTU_RT_PATH="/usr/lib/llvm-${CLANG_VER}/lib/clang/${CLANG_VER}/lib/linux"
          if [[ ! -d "${UBUNTU_RT_PATH}" ]]; then
            # Try /usr/lib/clang/<ver>/lib/linux as fallback
            UBUNTU_RT_PATH="/usr/lib/clang/${CLANG_VER}/lib/linux"
          fi
          echo "Ubuntu runtime path: ${UBUNTU_RT_PATH}"
          ls -la "${UBUNTU_RT_PATH}" || echo "Warning: runtime path not found"

          # PDFium bundles its own clang and expects libs at /usr/lib/clang/<bundled-ver>/lib/aarch64-unknown-linux-gnu/
          # Different PDFium versions bundle different clang versions (19, 20, 21, 22...)
          # Create symlinks for a range of versions to cover all cases
          for PDFIUM_CLANG_VER in 18 19 20 21 22 23; do
            TARGET_DIR="/usr/lib/clang/${PDFIUM_CLANG_VER}/lib/aarch64-unknown-linux-gnu"
            mkdir -p "${TARGET_DIR}"

            # Symlink runtime libraries
            for f in "${UBUNTU_RT_PATH}"/libclang_rt.*-aarch64*; do
              if [[ -f "$f" ]]; then
                fname=$(basename "$f")
                ln -sf "$f" "${TARGET_DIR}/${fname}"
                # Also create symlink without arch suffix
                fname_no_arch=$(echo "$fname" | sed 's/-aarch64//')
                if [[ "$fname" != "$fname_no_arch" ]]; then
                  ln -sf "$f" "${TARGET_DIR}/${fname_no_arch}"
                fi
              fi
            done
          done

          echo "Created symlinks for clang versions 18-23"
          ls -la /usr/lib/clang/20/lib/aarch64-unknown-linux-gnu/ || true
      - name: Build PDFium
        run: |
          ./scripts/build_pdfium.sh \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --target-os ubuntu \
            --arch "${{ matrix.arch }}"
      - name: Package PDFium
        run: |
          ./scripts/package_pdfium.sh \
            --pdfium-src ./build/pdfium \
            --pdfium-out ./build/pdfium/out/Release \
            --target-os ubuntu \
            --arch "${{ matrix.arch }}" \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --chromium-milestone "${{ inputs.chromium_milestone }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-ubuntu-${{ matrix.arch }}
          path: dist/*.tar.xz

  build-alpine:
    needs: build-ubuntu
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/docker/library/alpine:3.23
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-amd64
          - arch: arm64
            runner: self-hosted-arm64
    env:
      VPYTHON_BYPASS: "1"
    steps:
      - name: Install dependencies
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            clang \
            clang-dev \
            compiler-rt \
            curl \
            git \
            gcompat \
            glib-dev \
            gn \
            libc++-dev \
            libc6-compat \
            lld \
            llvm \
            ninja \
            nodejs \
            pkgconf \
            py3-pip \
            py3-six \
            python3 \
            tar \
            wget \
            xz \
            build-base \
            linux-headers
          # Install Python deps for depot_tools (gclient, gsutil)
          pip3 install httplib2 PySocks six --break-system-packages -q
          # Create httplib2.socks shim (depot_tools expects this submodule)
          python3 -c '
          import httplib2, os
          socks_file = os.path.join(os.path.dirname(httplib2.__file__), "socks.py")
          with open(socks_file, "w") as f:
              f.write("import socks as _socks\nfrom socks import *\nsocksocket = _socks.socksocket\nPROXY_TYPE_HTTP = _socks.HTTP\nPROXY_TYPE_HTTP_NO_TUNNEL = _socks.HTTP\nProxyError = _socks.ProxyError\n")
          '
          # Create symlinks for clang runtime libs (PDFium expects different target triple)
          # Alpine uses x86_64-alpine-linux-musl, but PDFium expects x86_64-unknown-linux-gnu
          CLANG_VER=$(clang --version | head -1 | sed 's/.*version \([0-9]*\).*/\1/')
          echo "System clang version: ${CLANG_VER}"
          # Create symlink for the target triple PDFium expects
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            ALPINE_TRIPLE="x86_64-alpine-linux-musl"
            TARGET_TRIPLE="x86_64-unknown-linux-gnu"
            ARCH_SUFFIX="x86_64"
          else
            ALPINE_TRIPLE="aarch64-alpine-linux-musl"
            TARGET_TRIPLE="aarch64-unknown-linux-gnu"
            ARCH_SUFFIX="aarch64"
          fi
          # Create symlinks at the system clang version path (PDFium uses same version when clang_base_path="/usr")
          mkdir -p /usr/lib/clang/${CLANG_VER}/lib/${TARGET_TRIPLE}
          echo "Creating symlinks in /usr/lib/clang/${CLANG_VER}/lib/${TARGET_TRIPLE}"
          # Symlink all runtime libs and create aliases without arch suffix (PDFium expects both)
          for f in /usr/lib/clang/${CLANG_VER}/lib/${ALPINE_TRIPLE}/*; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              ln -sf "$f" /usr/lib/clang/${CLANG_VER}/lib/${TARGET_TRIPLE}/${fname}
              # Also create symlink without arch suffix (e.g., libclang_rt.builtins.a from libclang_rt.builtins-x86_64.a)
              fname_no_arch=$(echo "$fname" | sed "s/-${ARCH_SUFFIX}//")
              if [ "$fname" != "$fname_no_arch" ]; then
                ln -sf "$f" /usr/lib/clang/${CLANG_VER}/lib/${TARGET_TRIPLE}/${fname_no_arch}
              fi
            fi
          done
          ls -la /usr/lib/clang/${CLANG_VER}/lib/${TARGET_TRIPLE}/ || echo "Directory not created"
      # NOTE: Using manual git checkout because actions/checkout@v4 (JavaScript action)
      # doesn't work in Alpine containers on ARM64 runners
      - name: Checkout
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64) EXPECT_ARCH="x86_64" ;;
            arm64) EXPECT_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCH="$(uname -m)"
          if [[ "${ACTUAL_ARCH}" != "${EXPECT_ARCH}" ]]; then
            echo "Runner arch ${ACTUAL_ARCH} does not match expected ${EXPECT_ARCH}" >&2
            exit 1
          fi
      - name: Build PDFium
        shell: bash
        run: |
          ./scripts/build_pdfium.sh \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --target-os alpine \
            --arch "${{ matrix.arch }}"
      - name: Package PDFium
        shell: bash
        run: |
          ./scripts/package_pdfium.sh \
            --pdfium-src ./build/pdfium \
            --pdfium-out ./build/pdfium/out/Release \
            --target-os alpine \
            --arch "${{ matrix.arch }}" \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --chromium-milestone "${{ inputs.chromium_milestone }}"
      - name: Upload artifact (AMD64)
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-alpine-${{ matrix.arch }}
          path: dist/*.tar.xz
      - name: Upload artifact (ARM64 workaround)
        # JavaScript actions don't work in Alpine ARM64 containers
        # Copy artifact to runner's temp directory for manual upload
        if: matrix.arch == 'arm64'
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Copy to runner's temp directory (accessible outside container)
          mkdir -p "${RUNNER_TEMP}/alpine-arm64-artifact"
          cp dist/*.tar.xz "${RUNNER_TEMP}/alpine-arm64-artifact/"
          ls -la "${RUNNER_TEMP}/alpine-arm64-artifact/"
          echo "Artifact copied to ${RUNNER_TEMP}/alpine-arm64-artifact for upload"

  upload-alpine-arm64:
    # Separate job to upload Alpine ARM64 artifact from outside the container
    needs: build-alpine
    runs-on: self-hosted-arm64
    if: always() && needs.build-alpine.result == 'success'
    steps:
      - name: Upload Alpine ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-alpine-arm64
          path: ${{ runner.temp }}/alpine-arm64-artifact/*.tar.xz
          if-no-files-found: error

  release:
    runs-on: self-hosted-amd64
    needs:
      - build-ubuntu
      - build-alpine
      - upload-alpine-arm64
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Set release tag
        id: tag
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            DATE_TAG=$(date -u +%Y-%m-%d)
            TAG="${{ inputs.chromium_milestone }}-${DATE_TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/**/*.tar.xz
