name: build

on:
  workflow_dispatch:
    inputs:
      pdfium_ref:
        description: "PDFium commit hash"
        required: true
      chromium_milestone:
        description: "Chromium milestone (example: M126)"
        required: true
      release_tag:
        description: "Release tag (default: M<milestone>-YYYY-MM-DD)"
        required: false
        default: ""

env:
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  build-ubuntu:
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/docker/library/ubuntu:24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-amd64
          - arch: arm64
            runner: self-hosted-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner architecture
        run: |
          case "${{ matrix.arch }}" in
            amd64) EXPECT_ARCH="x86_64" ;;
            arm64) EXPECT_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCH="$(uname -m)"
          if [[ "${ACTUAL_ARCH}" != "${EXPECT_ARCH}" ]]; then
            echo "Runner arch ${ACTUAL_ARCH} does not match expected ${EXPECT_ARCH}" >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            clang \
            curl \
            generate-ninja \
            git \
            libglib2.0-dev \
            lld \
            llvm \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            xz-utils \
            build-essential
      - name: Setup clang runtime symlinks (ARM64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          # PDFium build expects clang runtime libraries at specific paths
          # that differ from Ubuntu's default layout
          CLANG_VER=$(clang --version | head -1 | sed 's/.*version \([0-9]*\).*/\1/')
          echo "Detected system clang version: ${CLANG_VER}"

          # Find where Ubuntu has the clang runtime libs
          # Ubuntu 24.04 uses /usr/lib/llvm-<ver>/lib/clang/<ver>/lib/linux/
          UBUNTU_RT_PATH="/usr/lib/llvm-${CLANG_VER}/lib/clang/${CLANG_VER}/lib/linux"
          if [[ ! -d "${UBUNTU_RT_PATH}" ]]; then
            # Try /usr/lib/clang/<ver>/lib/linux as fallback
            UBUNTU_RT_PATH="/usr/lib/clang/${CLANG_VER}/lib/linux"
          fi
          echo "Ubuntu runtime path: ${UBUNTU_RT_PATH}"
          ls -la "${UBUNTU_RT_PATH}" || echo "Warning: runtime path not found"

          # PDFium bundles its own clang and expects libs at /usr/lib/clang/<bundled-ver>/lib/aarch64-unknown-linux-gnu/
          # Different PDFium versions bundle different clang versions (19, 20, 21, 22...)
          # Create symlinks for a range of versions to cover all cases
          for PDFIUM_CLANG_VER in 18 19 20 21 22 23; do
            TARGET_DIR="/usr/lib/clang/${PDFIUM_CLANG_VER}/lib/aarch64-unknown-linux-gnu"
            mkdir -p "${TARGET_DIR}"

            # Symlink runtime libraries
            for f in "${UBUNTU_RT_PATH}"/libclang_rt.*-aarch64*; do
              if [[ -f "$f" ]]; then
                fname=$(basename "$f")
                ln -sf "$f" "${TARGET_DIR}/${fname}"
                # Also create symlink without arch suffix
                fname_no_arch=$(echo "$fname" | sed 's/-aarch64//')
                if [[ "$fname" != "$fname_no_arch" ]]; then
                  ln -sf "$f" "${TARGET_DIR}/${fname_no_arch}"
                fi
              fi
            done
          done

          echo "Created symlinks for clang versions 18-23"
          ls -la /usr/lib/clang/20/lib/aarch64-unknown-linux-gnu/ || true
      - name: Build PDFium
        run: |
          ./scripts/build_pdfium.sh \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --target-os ubuntu \
            --arch "${{ matrix.arch }}"
      - name: Package PDFium
        run: |
          ./scripts/package_pdfium.sh \
            --pdfium-src ./build/pdfium \
            --pdfium-out ./build/pdfium/out/Release \
            --target-os ubuntu \
            --arch "${{ matrix.arch }}" \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --chromium-milestone "${{ inputs.chromium_milestone }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-ubuntu-${{ matrix.arch }}
          path: dist/*.tar.xz

  build-alpine:
    needs: build-ubuntu
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/docker/library/alpine:3.23
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-amd64
          - arch: arm64
            runner: self-hosted-arm64
    env:
      VPYTHON_BYPASS: "1"
    steps:
      - name: Install dependencies
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            clang \
            clang-dev \
            compiler-rt \
            curl \
            git \
            gcompat \
            glib-dev \
            gn \
            libc++-dev \
            libc6-compat \
            lld \
            llvm \
            ninja \
            nodejs \
            perl \
            pkgconf \
            py3-pip \
            py3-six \
            python3 \
            tar \
            wget \
            xz \
            build-base \
            linux-headers
          # Install Python deps for depot_tools (gclient, gsutil)
          pip3 install httplib2 PySocks six --break-system-packages -q
          # Create httplib2.socks shim (depot_tools expects this submodule)
          python3 -c '
          import httplib2, os
          socks_file = os.path.join(os.path.dirname(httplib2.__file__), "socks.py")
          with open(socks_file, "w") as f:
              f.write("import socks as _socks\nfrom socks import *\nsocksocket = _socks.socksocket\nPROXY_TYPE_HTTP = _socks.HTTP\nPROXY_TYPE_HTTP_NO_TUNNEL = _socks.HTTP\nProxyError = _socks.ProxyError\n")
          '
          # Create symlinks for clang runtime libs (PDFium expects different target triple)
          # Alpine uses x86_64-alpine-linux-musl, but PDFium expects x86_64-unknown-linux-gnu
          CLANG_VER=$(clang --version | head -1 | sed 's/.*version \([0-9]*\).*/\1/')
          echo "System clang version: ${CLANG_VER}"
          # Create symlink for the target triple PDFium expects
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            ALPINE_TRIPLE="x86_64-alpine-linux-musl"
            TARGET_TRIPLE="x86_64-unknown-linux-gnu"
            ARCH_SUFFIX="x86_64"
          else
            ALPINE_TRIPLE="aarch64-alpine-linux-musl"
            TARGET_TRIPLE="aarch64-unknown-linux-gnu"
            ARCH_SUFFIX="aarch64"
          fi
          # PDFium bundles its own clang and expects libs at /usr/lib/clang/<bundled-ver>/lib/<triple>/
          # Different PDFium versions bundle different clang versions (18, 19, 20, 21, 22...)
          # Create symlinks for a range of versions to cover all cases
          for PDFIUM_CLANG_VER in 18 19 20 21 22 23; do
            mkdir -p /usr/lib/clang/${PDFIUM_CLANG_VER}/lib/${TARGET_TRIPLE}
            # Symlink all runtime libs from system clang
            for f in /usr/lib/clang/${CLANG_VER}/lib/${ALPINE_TRIPLE}/*; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                ln -sf "$f" /usr/lib/clang/${PDFIUM_CLANG_VER}/lib/${TARGET_TRIPLE}/${fname}
                # Also create symlink without arch suffix
                fname_no_arch=$(echo "$fname" | sed "s/-${ARCH_SUFFIX}//")
                if [ "$fname" != "$fname_no_arch" ]; then
                  ln -sf "$f" /usr/lib/clang/${PDFIUM_CLANG_VER}/lib/${TARGET_TRIPLE}/${fname_no_arch}
                fi
              fi
            done
          done
          echo "Created symlinks for clang versions 18-23"
          ls -la /usr/lib/clang/20/lib/${TARGET_TRIPLE}/ || echo "Directory not created"
      # NOTE: Using manual git checkout because actions/checkout@v4 (JavaScript action)
      # doesn't work in Alpine containers on ARM64 runners
      - name: Checkout
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64) EXPECT_ARCH="x86_64" ;;
            arm64) EXPECT_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCH="$(uname -m)"
          if [[ "${ACTUAL_ARCH}" != "${EXPECT_ARCH}" ]]; then
            echo "Runner arch ${ACTUAL_ARCH} does not match expected ${EXPECT_ARCH}" >&2
            exit 1
          fi
      - name: Build PDFium
        shell: bash
        run: |
          ./scripts/build_pdfium.sh \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --target-os alpine \
            --arch "${{ matrix.arch }}"
      - name: Package PDFium
        shell: bash
        run: |
          ./scripts/package_pdfium.sh \
            --pdfium-src ./build/pdfium \
            --pdfium-out ./build/pdfium/out/Release \
            --target-os alpine \
            --arch "${{ matrix.arch }}" \
            --pdfium-ref "${{ inputs.pdfium_ref }}" \
            --chromium-milestone "${{ inputs.chromium_milestone }}"
      - name: Upload artifact (AMD64)
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-alpine-${{ matrix.arch }}
          path: dist/*.tar.xz
      - name: Upload artifact (ARM64 via API)
        # JavaScript actions don't work in Alpine ARM64 containers
        # Use GitHub API directly to upload artifact
        if: matrix.arch == 'arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Install gh CLI (static binary works on musl)
          wget -q "https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_arm64.tar.gz" -O /tmp/gh.tar.gz
          tar xzf /tmp/gh.tar.gz -C /tmp
          GH=/tmp/gh_2.62.0_linux_arm64/bin/gh

          # Get the artifact file
          ARTIFACT_FILE=$(ls dist/*.tar.xz)
          ARTIFACT_NAME=$(basename "$ARTIFACT_FILE")
          echo "Uploading artifact: $ARTIFACT_NAME"

          # Upload artifact using GitHub API
          # Create the artifact
          ARTIFACT_RESPONSE=$($GH api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=pdfium-alpine-arm64" \
            2>&1) || true
          echo "Create response: $ARTIFACT_RESPONSE"

          # The artifacts API requires using the upload URL from the response
          # For simplicity, upload to release assets instead using a temp tag
          TEMP_TAG="temp-alpine-arm64-${{ github.run_id }}"
          $GH release create "$TEMP_TAG" "$ARTIFACT_FILE" \
            --repo "${{ github.repository }}" \
            --title "Temp upload" \
            --notes "Temporary upload for workflow" \
            --prerelease
          echo "Uploaded to temporary release: $TEMP_TAG"

  release:
    runs-on: self-hosted-amd64
    needs:
      - build-ubuntu
      - build-alpine
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Download Alpine ARM64 from temp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEMP_TAG="temp-alpine-arm64-${{ github.run_id }}"
          mkdir -p dist/alpine-arm64
          gh release download "$TEMP_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.tar.xz" \
            --dir dist/alpine-arm64 || echo "Warning: temp release not found"
          ls -la dist/alpine-arm64/ || true
      - name: Set release tag
        id: tag
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            DATE_TAG=$(date -u +%Y-%m-%d)
            TAG="${{ inputs.chromium_milestone }}-${DATE_TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/**/*.tar.xz
      - name: Cleanup temp release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEMP_TAG="temp-alpine-arm64-${{ github.run_id }}"
          gh release delete "$TEMP_TAG" --repo "${{ github.repository }}" --yes || true
          gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/$TEMP_TAG" || true
